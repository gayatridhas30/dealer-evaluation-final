<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dealership Application</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap">
    <style>
        body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        .navbar { background-color: #343a40; padding: 1rem 2rem; position: fixed; width: 100%; top: 0; z-index: 100; }
        .navbar .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .navbar .nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; }
        .navbar .nav-links li a { color: #fff; text-decoration: none; transition: 0.3s; }
        .navbar .nav-links li a.active, .navbar .nav-links li a:hover { color: #00adb5; }
        .container { max-width: 1200px; margin: 80px auto 0; padding: 0 20px; }
        .contact-section { background: white; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin-left: auto; margin-right: auto; }
        .contact-section h2 { margin-top: 0; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #dee2e6; border-radius: 4px; }
        .form-group textarea { min-height: 150px; }
        footer { text-align: center; padding: 2rem; color: #6c757d; margin-top: 2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="logo">Dealership App</a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a class="active" href="/contact">Contact</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <section class="contact-section">
            <h2>Contact Us</h2>
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </section>
    </div>
    
    <footer>
        <p>&copy; 2026 Dealership Application. All rights reserved.</p>
    </footer>
</body>
</html>
